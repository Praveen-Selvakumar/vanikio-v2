<!-- VANIKIO Portfolio tab fragment -->
<div id="businessProfilePanel">
        <div class="profile-card">

            <!-- Hero -->

            <div class="hero">

                <div class="vanikio-badge">
                    VANIKIO
                </div>

            </div>


            <!-- Content -->

            <div class="profile-content">

                <!-- Logo -->

                <div class="logo-wrapper">

                    <img
                            id="businessLogo"
                            class="logo"
                            src=""
                            alt="Business Logo"
                    >

                </div>


                <!-- Business Header -->

                <div class="business-header">

                    <h1
                            id="businessName"
                            class="business-name"
                    >
                    </h1>

                    <div
                            id="category"
                            class="category"
                    >
                    </div>

                </div>


                <!-- About -->

                <p
                        id="description"
                        class="description"
                >
                </p>


                <!-- Business ID + QR -->

                <div class="business-id-box">

                    <div class="business-id-content">

                        <div class="business-id-label">
                            Business ID
                        </div>

                        <div
                                id="businessId"
                                class="business-id"
                        >
                        </div>

                        <div class="qr-hint">
                            Scan the QR code to open this business profile
                        </div>

                    </div>


                    <div class="qr-area">

                        <div class="qr-wrapper">

                            <div
                                    id="businessQr"
                            ></div>

                        </div>

                        <button
                                id="downloadQrButton"
                                class="download-qr-btn"
                                type="button"
                        >
                            ↓ Download QR
                        </button>

                    </div>

                </div>


                <div class="divider"></div>


                <!-- Contact Information -->

                <div>

                    <div class="section-title">
                        Business Information
                    </div>


                    <div class="info-grid">


                        <!-- Location -->

                        <div class="info-card">

                            <div class="info-icon">
                                📍
                            </div>

                            <span class="info-label">
                            Location
                        </span>

                            <span
                                    id="address"
                                    class="info-value"
                            >
                        </span>

                        </div>


                        <!-- Phone -->

                        <div class="info-card">

                            <div class="info-icon">
                                📞
                            </div>

                            <span class="info-label">
                            Phone
                        </span>

                            <span
                                    id="phone"
                                    class="info-value"
                            >
                        </span>

                        </div>


                        <!-- Email -->

                        <div class="info-card">

                            <div class="info-icon">
                                ✉️
                            </div>

                            <span class="info-label">
                            Email
                        </span>

                            <span
                                    id="email"
                                    class="info-value"
                            >
                        </span>

                        </div>


                        <!-- Website -->

                        <div class="info-card">

                            <div class="info-icon">
                                🌐
                            </div>

                            <span class="info-label">
                            Website
                        </span>

                            <span
                                    id="website"
                                    class="info-value"
                            >
                        </span>

                        </div>

                    </div>

                </div>


                <!-- Social Links -->

                <div
                        id="socialSection"
                        class="social-section"
                        style="display:none;"
                >

                    <div class="section-title">
                        Connect
                    </div>

                    <div
                            id="socialLinks"
                            class="social-links"
                    >
                    </div>

                </div>


                <!-- Actions -->

                <div class="actions">

                    <a
                            id="callButton"
                            class="btn call-btn"
                            href="#"
                    >
                        📞 Call
                    </a>


                    <a
                            id="whatsappButton"
                            class="btn whatsapp-btn"
                            href="#"
                            target="_blank"
                            rel="noopener noreferrer"
                    >
                        💬 WhatsApp
                    </a>

                </div>

            </div>

        </div>


        <!-- Footer -->

        <div class="profile-footer">

            Powered by
            <strong>VANIKIO</strong>

        </div>
        </div> <!-- end businessProfilePanel -->
